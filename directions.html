<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>태안 맘마미아 애견동반 펜션 - 오시는길</title>
    <meta name="description" content="만리포해수욕장 인근 태안 애견동반 펜션입니다. 넓은 객실, 수영장, 바베큐 시설 보유하고 있어 가족, 단체로 즐거운 추억 쌓아보세요.">
    <meta name="keywords" content="">
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/directions.css">

  <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="태안 맘마미아 애견동반 펜션 - 오시는길" />
  <meta property="og:description" content="만리포해수욕장 인근 태안 애견동반 펜션입니다. 넓은 객실, 수영장, 바베큐 시설 보유하고 있어 가족, 단체로 즐거운 추억 쌓아보세요." />
  
  <meta property="og:url" content="https://mammamiaps.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="태안 맘마미아 애견동반 펜션 - 오시는길" />
  <meta name="twitter:description" content="만리포해수욕장 인근 태안 애견동반 펜션입니다. 넓은 객실, 수영장, 바베큐 시설 보유하고 있어 가족, 단체로 즐거운 추억 쌓아보세요." />
  
  <meta name="naver-site-verification" content="974ddb889f8765d56a785bcdb489223163f6f5be" />
  <meta name="google-site-verification" content="rXbC5TvmMtsYgxI4fs_7WBTR_JOt6LAmxdvwSOHkxdQ" />
</head>
<body>
    <main class="main-content">
         <!-- CUSTOM FIELD : 메인 소개 섹션 -->
        <!-- homepage.customFields.pages.directions.sections[0].hero.images 매핑 -->
        <section class="hero-section hero-center-bottom">
            <div class="hero-slider" data-hero-image>
                <!-- 첫번째 선택 이미지 1장만 노출 -->
            </div>
           <!-- 페이지명 하드코딩 -->
            <div class="hero-property-title">DIRECTIONS</div>
        </section>
        <section class="location-section">
            <div class="location-content">
                <!-- property.name + "오시는 길" 매핑 -->
                <h2 class="about-title animate-element" data-directions-title>
                    <span data-property-name></span> 오시는 길
                </h2>
                <div class="location-details animate-element">
                    <div class="location-address-wrapper animate-element">
                        <div class="location-address-section">
                            <svg class="location-icon" xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 0 25 25" fill="none">
                                <path d="M12 12C14.4853 12 16.5 9.98528 16.5 7.5C16.5 5.01472 14.4853 3 12 3C9.51472 3 7.5 5.01472 7.5 7.5C7.5 9.98528 9.51472 12 12 12Z" stroke="currentColor" stroke-miterlimit="10" stroke-linecap="round"/>
                                <path d="M12 14.0137V22" stroke="currentColor" stroke-miterlimit="10" stroke-linecap="round"/>
                            </svg>
                            <!-- property.address 매핑 -->
                            <p class="location-address" data-directions-address></p>
                        </div>

                        <!-- 구분선 -->
                        <div class="location-divider"></div>

                        <!-- homepage.customFields.pages.directions.sections[0].notice.description 매핑 -->
                        <!-- 데이터 없으면 display: none -->
                        <div class="location-note" data-directions-notes>
                            <!-- 동적으로 p 태그가 생성됩니다 -->
                        </div>
                    </div>
                </div>

                <!-- 지도 섹션 -->
                <div class="map-wrapper animate-element">
                    <div class="map-container">
                        <div id="kakao-map"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- property.images[0].exterior 첫번째 이미지 배경 매핑 -->
    <section class="full-banner" data-directions-banner-bg>
      <!-- property.nameEn 매핑 (uppercase) -->
      <h2 class="full-banner-title" data-directions-banner-title></h2>
    </section>



    <!-- Kakao Map SDK -->
    <script type="text/javascript" src="js/kakao-maps-sdk.js"></script>

    <!-- Include ImageWithFallback script (standard-template-data.json에서만 필요) -->
    <!-- <script src="js/image-with-fallback.js"></script> -->

    <!-- Common JavaScript -->
    <script src="js/common.js"></script>

    <!-- Image Helpers (매핑 시 주석 해제 필요) -->
    <script src="js/image-helpers.js"></script>

    <!-- Base Data Mapper -->
    <script src="js/data-mapper/core/base-mapper.js"></script>

    <!-- Directions Page Mapper -->
    <script src="js/data-mapper/pages/directions-mapper.js"></script>

    <!-- Preview Handler for Admin Integration -->
    <script src="js/preview-handler.js"></script>

    <!-- Header Footer Mapper -->
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>

    <!-- Header and Footer Loader -->
    <script src="js/header-footer-loader.js"></script>

    <!-- Page-specific script -->
    <script src="js/pages/directions.js"></script>

    <!-- Scroll Animations -->
    <script src="js/scroll-animations.js"></script>

</body>
</html>
