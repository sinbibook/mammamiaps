<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="keywords" content="">
    <!-- Preload critical resources -->
    <link rel="preload" href="styles/common.css" as="style">
    <link rel="preload" href="styles/reservation.css" as="style">
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/reservation.css">

  <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="태안 맘마미아 애견동반 펜션 - 예약안내" />
  <meta property="og:description" content="만리포해수욕장 인근 태안 애견동반 펜션입니다. 넓은 객실, 수영장, 바베큐 시설 보유하고 있어 가족, 단체로 즐거운 추억 쌓아보세요." />
  
  <meta property="og:url" content="https://mammamiaps.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="태안 맘마미아 애견동반 펜션 - 예약안내" />

  <meta name="naver-site-verification" content="974ddb889f8765d56a785bcdb489223163f6f5be" />
  <meta name="google-site-verification" content="rXbC5TvmMtsYgxI4fs_7WBTR_JOt6LAmxdvwSOHkxdQ" />
</head>
<body>
    <main class="main-content">
        <!-- CUSTOM FIELD : 메인 소개 섹션 -->
        <section class="hero-section hero-center-bottom">
            <div class="hero-slider" data-hero-image>
                <!-- 첫번째 선택 이미지 1장만 노출 -->
            </div>
            <!-- 페이지명 하드코딩 -->
            <div class="hero-property-title">RESERVATION</div>
        </section>

    </main>

        <section class="reservation-main-section">
            <div class="reservation-main-content">
                  <h2 class="about-title animate-element" data-directions-title>
                    <span data-property-name></span> 예약안내
                </h2>
                <div class="reservation-full-image animate-element" data-reservation-about-image>
                    <img src="" alt="Reservation Image">
                </div>

                <!-- 탭 메뉴 -->
                <div class="reservation-tabs animate-element">
                    <button class="tab-button active" data-tab="usage">이용안내</button>
                    <button class="tab-button" data-tab="refund">환불/취소 규정 안내</button>
                </div>

                <!-- 탭 컨텐츠 -->
                <div class="reservation-tab-content animate-element">
                    <!-- 이용안내 탭 -->
                    <div class="tab-panel active" data-panel="usage">
                        <div class="reservation-text-content" data-usage-guide>
                            <!-- 이용안내 내용 동적 매핑 -->
                        </div>
                    </div>

                    <!-- 환불 탭 -->
                    <div class="tab-panel" data-panel="refund">
                        <div class="refund-table-section">
                            <h4 class="refund-section-title">환불 규정표</h4>
                            <div class="refund-table-wrapper">
                                <table class="refund-table">
                                    <thead>
                                        <tr>
                                            <th>취소 시점</th>
                                            <th>환불율</th>
                                        </tr>
                                    </thead>
                                    <tbody class="refund-table-body">
                                        <!-- 동적으로 행이 생성됩니다 -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="refund-text-section">
                            <h4 class="refund-section-title">취소 및 환불 안내</h4>
                            <div class="refund-notes reservation-text-content" data-refund-notes>
                                <!-- 환불 정책 안내문 텍스트 동적 매핑 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 예약하기 버튼 링크 추가 -->
        <div class="reservation-book-now">
            <a href="#" class="reservation-book-btn" data-property-realtime-booking-id target="_blank">예약</a>
        </div>

    <!-- property.images[0].exterior 첫번째 이미지 배경 매핑 -->
    <section class="full-banner" data-reservation-banner-bg>
      <!-- property.nameEn 매핑 (uppercase) -->
      <h2 class="full-banner-title" data-reservation-banner-title></h2>
    </section>


    <!-- Include ImageWithFallback script (standard-template-data.json에서만 필요) -->
    <!-- <script src="js/image-with-fallback.js"></script> -->

    <!-- Image Helpers -->
    <script src="js/image-helpers.js"></script>

    <!-- Base Data Mapper -->
    <script src="js/data-mapper/core/base-mapper.js"></script>

    <!-- Reservation Page Mapper -->
    <script src="js/data-mapper/pages/reservation-mapper.js"></script>

    <!-- Preview Handler for Admin Integration -->
    <script src="js/preview-handler.js"></script>

    <!-- Header Footer Mapper -->
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>

    <!-- Header and Footer Loader -->
    <script src="js/header-footer-loader.js"></script>

    <!-- Page-specific script -->
    <script src="js/pages/reservation.js"></script>

    <!-- Scroll Animations -->
    <script src="js/scroll-animations.js"></script>

</body>
</html>
